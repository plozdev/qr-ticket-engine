spring:
  application:
    name: backend-api
  datasource:
    url: jdbc:postgresql://localhost:5432/ticket_engine
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

security:
  totp:
    time-step-seconds: 30
    algorithm: HmacSHA256